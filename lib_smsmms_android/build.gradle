plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id("maven-publish") apply true
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = "com.afkanerd"
                artifactId = "lib_smsmms_android"
                version = "1.0.0"
            }
        }
    }
}

android {
    namespace 'com.afkanerd.lib_smsmms_android'
    compileSdk 37

    defaultConfig {
        minSdk 24
        targetSdk 37

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

        resourceConfigurations += ["en", "fr", "ru", "de", "pl"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
        buildConfig = true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.room:room-common-jvm:2.8.5"
    implementation "androidx.room:room-runtime:2.8.5"
    implementation "androidx.paging:paging-common:3.5.1"
    implementation "androidx.compose.runtime:runtime:1.12.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.12.1"
    implementation "androidx.navigation:navigation-runtime-ktx:2.10.1"
    implementation "androidx.navigation:navigation-compose:2.10.1"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.animation:animation:1.12.1"
    implementation("androidx.media3:media3-exoplayer:1.11.1")
    implementation("androidx.media3:media3-exoplayer-dash:1.11.1")
    implementation("androidx.media3:media3-ui:1.11.1")
    implementation("androidx.media3:media3-ui-compose:1.11.1")
    implementation libs.ui.test.junit4
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    annotationProcessor "androidx.room:room-compiler:2.8.5"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

    implementation libs.android.smsmms
    implementation "com.googlecode.libphonenumber:libphonenumber:9.0.39"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    debugImplementation "androidx.compose.ui:ui-tooling:1.12.1"

    def room_version = "2.8.4"

    // If this project uses any Kotlin source, use Kotlin Symbol Processing (KSP)
    // See KSP Quickstart to add KSP to your build
    ksp "androidx.room:room-compiler:$room_version"

    // If this project only uses Java source, use the Java annotationProcessor
    // No additional plugins are necessary
    annotationProcessor "androidx.room:room-compiler:$room_version"

//    // optional - RxJava2 support for Room
//    implementation libs.androidx.room.rxjava2
//
//    // optional - RxJava3 support for Room
//    implementation libs.androidx.room.rxjava3
//
//    // optional - Guava support for Room, including Optional and ListenableFuture
//    implementation libs.androidx.room.guava

    // optional - Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // optional - Paging 3 Integration
    implementation "androidx.room:room-paging:$room_version"

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation libs.androidx.compose.material
    // or skip Material Design and build directly on top of foundational components
    implementation 'androidx.compose.foundation:foundation'
    // or only import the main APIs for the underlying toolkit systems,
    // such as input and measurement/layout
    implementation 'androidx.compose.ui:ui'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Included automatically by material, only add when you need
    // the icons but not the material library (e.g. when using Material3 or a
    // custom design system based on Foundation)
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    // Optional - Add window size utils
    implementation 'androidx.compose.material3.adaptive:adaptive'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Optional - Integration with RxJava
    implementation 'androidx.compose.runtime:runtime-rxjava2'

    implementation "com.google.accompanist:accompanist-permissions:0.37.3"
    implementation("androidx.paging:paging-compose:3.5.1")

    implementation("androidx.preference:preference:1.2.1")

    implementation("io.coil-kt.coil3:coil-compose:3.6.3")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.6.3")

    implementation("io.coil-kt.coil3:coil-video:3.4.0")

    implementation("com.google.code.gson:gson:2.14.0")

    implementation("sh.calvin.autolinktext:autolinktext:2.0.2")

    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.datastore:datastore-preferences-core:1.2.1"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    api 'net.zetetic:sqlcipher-android:4.19.0@aar'
    api 'androidx.sqlite:sqlite:2.7.1'
    implementation "androidx.security:security-crypto:1.1.0"
    // Preferences DataStore (SharedPreferences like APIs)
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Alternatively - without an Android dependency.
    implementation "androidx.datastore:datastore-preferences-core:1.2.1"
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")
    // Check for the latest version on [Android Developers](https://developer.android.com)


}